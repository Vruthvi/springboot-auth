# Server - OpenShift assigns $PORT, listen on all interfaces
server.address=0.0.0.0
server.port=${PORT:8080}

# Database - all overridable via env / OpenShift Secrets.
# Option A (preferred on OpenShift): set SPRING_DATASOURCE_URL directly as a Secret.
# Option B: set DB_HOST / DB_PORT / DB_DATABASE / DB_USERNAME / DB_PASSWORD.
# Defaults below are your local TiDB values so `mvn spring-boot:run` still works.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:gateway01.ap-southeast-1.prod.aws.tidbcloud.com}:${DB_PORT:4000}/${DB_DATABASE:test}?sslMode=REQUIRED&allowPublicKeyRetrieval=true&useSSL=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:2TtmVo549Nrc4s2.root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:ugf5CcbeTQRzE27K}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT - MUST be overridden on OpenShift via JWT_SECRET (min 32 chars)
app.jwt.secret=${JWT_SECRET:MySuperSecretKeyForJwtMustBeAtLeast32CharsLong123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - comma-separated. Set CORS_ALLOWED_ORIGINS on OpenShift to your frontend Route.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator probes for OpenShift liveness/readiness
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
